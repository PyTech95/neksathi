<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ee233d" />
    <meta name="description" content="Personal safety, family sharing and Smart QR. Stay connected to the people and things you care about with Nek Sathi." />
    <meta property="og:title" content="Nek Sathi — Your everyday safety companion" />
    <meta property="og:description" content="Your people. Your everyday. A little safer. Personal safety, family circles and Smart QR, together in Nek Sathi." />
    <meta property="og:type" content="website" />

    <link rel="preload" as="image" href="%PUBLIC_URL%/website/generated/hero-road.webp" />
    <title>Nek Sathi — Your everyday safety companion</title>
    <style>
      /* Dark first paint so no device ever flashes a white/blank screen
         before the app's CSS and JS have loaded. */
      html, body, #root { height: 100%; }
      html, body { margin: 0; background: #07070d; color: #e8e8f5;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 14px; background: #07070d; }
      #boot .ring { width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(233,37,70,.25); border-top-color: #e92546;
        animation: bootspin 1s linear infinite; }
      #boot p { color: #9a9ab5; font-size: 13px; margin: 0; letter-spacing: .04em; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Nek Sathi. The website brings together personal safety tools, family sharing and Smart QR.</noscript>
    <div id="root"><div id="boot"><div class="ring"></div><p>Nek Sathi…</p></div></div>
  </body>
