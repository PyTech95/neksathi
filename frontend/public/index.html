<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ee233d" />
    <meta name="description" content="Personal safety, family sharing and Smart QR. Stay connected to the people and things you care about with Nek Sathi." />
    <meta property="og:title" content="Nek Sathi — Your everyday safety companion" />
    <meta property="og:description" content="Your people. Your everyday. A little safer. Personal safety, family circles and Smart QR, together in Nek Sathi." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nek Sathi" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/website/favicon.png" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/website/generated/hero-road.webp" />
    <title>Nek Sathi — Your everyday safety companion</title>
    <style>
      /* Dark first paint so no device ever flashes a white/blank screen
         before the app's CSS and JS have loaded. */
      html, body, #root { height: 100%; }
      html, body { margin: 0; background: #07070d; color: #e8e8f5;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 18px; background: #07070d; }
      /* Transparent brand logo with a slow, gentle zoom-in — then a soft breathe.
         Deliberately unhurried so it feels calm on every device. */
      #boot img { width: 96px; height: 96px; object-fit: contain;
        animation: bootZoom 1.8s cubic-bezier(.2,.7,.2,1) both, bootBreathe 3.2s ease-in-out 1.8s infinite; }
      #boot .wm { font-size: 20px; font-weight: 800; letter-spacing: -.01em; color: #edeef6;
        opacity: 0; animation: bootFade .6s ease .7s forwards; }
      #boot .wm b { color: #e92546; }
      #boot .bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgba(233,37,70,.18); opacity: 0; animation: bootFade .6s ease 1s forwards; }
      #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg,#b3122f,#e92546); animation: bootSlide 1.2s ease-in-out infinite; }
      @keyframes bootZoom { from { opacity: 0; transform: scale(.80); } to { opacity: 1; transform: scale(1); } }
      @keyframes bootBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
      @keyframes bootFade { to { opacity: 1; } }
      @keyframes bootSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Nek Sathi. The website brings together personal safety tools, family sharing and Smart QR.</noscript>
    <div id="root"><div id="boot"><img src="%PUBLIC_URL%/website/logo-mark.png" alt="Nek Sathi" /><div class="wm">Nek <b>Sathi</b></div><div class="bar"><i></i></div></div></div>
  </body>
</html>
